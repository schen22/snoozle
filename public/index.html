<body>
<div class="wrap" id="app">
  <div class="scene-wrap" id="scene-wrap">

      <g class="cloud c2"><ellipse cx="190" cy="30" rx="26" ry="11"/><ellipse cx="206" cy="23" rx="15" ry="12"/></g>
      <g class="cloud c3"><ellipse cx="130" cy="58" rx="34" ry="13"/><ellipse cx="146" cy="49" rx="19" ry="14"/><ellipse cx="250" cy="62" rx="28" ry="11"/></g>
      <polygon id="bolt" points="216,64 204,96 214,96 206,124 228,86 217,86 226,64"/>
      <g id="rain"></g>

        <path class="umb-leaf" d="M110 70 Q156 26 202 70 Q191 63 179 70 Q167 63 156 70 Q145 63 133 70 Q121 63 110 70 Z"/>
        <path class="umb-rib" d="M156 68 L156 46 M156 57 L142 49 M156 57 L170 49"/>
      </g>
      <ellipse class="b-shadow" cx="160" cy="158" rx="30" ry="5"/>
      <g id="buddy" transform="translate(160,158)" data-act="tap">
        <g id="buddy-idle"><g id="buddy-pose"><g id="buddy-react">
          <ellipse class="b-foot b-line" cx="-13" cy="-3" rx="8" ry="4.5"/>
          <ellipse class="b-foot b-line" cx="13" cy="-3" rx="8" ry="4.5"/>
          <path class="b-line" d="M0 -54 L0 -64" fill="none"/>
          <path class="b-leaf b-line" d="M0 -62 C6 -78 22 -78 26 -72 C20 -64 8 -60 0 -62 Z"/>
          <path class="b-leaf b-line" d="M0 -60 C-4 -70 -14 -72 -18 -68 C-14 -62 -6 -59 0 -60 Z"/>
          <g id="pack"></g>
          <ellipse class="b-body b-line" cx="0" cy="-28" rx="28" ry="27"/>

            <circle cx="-9" cy="-31" r="4" fill="var(--face)"/>
            <circle cx="9" cy="-31" r="4" fill="var(--face)"/>
            <circle cx="-7.5" cy="-32.5" r="1.3" fill="var(--body)"/>
            <circle cx="10.5" cy="-32.5" r="1.3" fill="var(--body)"/>
          </g>
          <g class="eyes-closed">
            <path d="M-14 -30 q5 4 10 0 M4 -30 q5 4 10 0" stroke="var(--face)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          </g>
          <ellipse class="b-cheek" cx="-17" cy="-22" rx="5" ry="3"/>
          <ellipse class="b-cheek" cx="17" cy="-22" rx="5" ry="3"/>
          <path class="mouth-happy" d="M-4 -21 q4 4 8 0" stroke="var(--face)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          <path class="mouth-strain" d="M-6 -20 q2 -2 4 0 q2 2 4 0 q2 -2 4 0" stroke="var(--face)" stroke-width="2.2" fill="none" stroke-linecap="round"/>
          <path class="brows" d="M-15 -37 L-6 -40 M15 -37 L6 -40" stroke="var(--face)" stroke-width="2.2" fill="none" stroke-linecap="round"/>
          <path class="sweat" d="M-25 -50 Q-30 -42 -25 -39 Q-20 -42 -25 -50 Z"/>
          <text class="zz" x="26" y="-56">z z</text>
        </g></g></g>
      </g>
      </g>
    </svg>
  </div>
</div>
<script src="js/copy.js"></script>
<script>
// ── STATE ──
// Facts only. Everything else (water, stage, N, heavy, friendship, line) is derived on every render.
const SKY = {sunny: {water: 1, anim: 'a-bounce'}, cloudy: {water: 1, anim: 'a-sway'}, drizzly: {water: 2, anim: 'a-droop'}, stormy: {water: 2, anim: 'a-nap'}};
const STAGE_AT = [0, 1, 3, 5];         // seed, sprout, bud, bloom: water needed
const BOND_AT = [0, 2, 6, 12, 20, 35]; // friendship needed for each line in COPY.bond
const freshDay = date => ({date, sky: null, care: 0, cared: new Map(), moves: [], seq: 0, bond: new Set(), usual: 4, screen: 'home', sheet: null});
const state = {...freshDay(''), futureMoves: []};
const nFor = (sky, b) => sky === 'drizzly' ? Math.max(1, Math.ceil(b * 0.75)) : sky === 'stormy' ? Math.max(1, Math.round(b / 2)) : b;
function derive(s) {
  const water = (s.sky ? SKY[s.sky].water : 0) + s.care;
  const N = nFor(s.sky, s.usual);
  const unfinished = s.moves.filter(m => !m.used).length;
  const load = s.moves.length; // taught today and still in the day (used + unfinished)
  const friendship = s.bond.size;
  return {
    sky: s.sky, usual: s.usual, water, N, unfinished, load, friendship,
    stage: STAGE_AT.filter(t => water >= t).length - 1,
    heavy: load > N && unfinished >= 1,
    line: BOND_AT.filter(t => friendship >= t).length - 1
  };
}

// ── STORE ──
const store = (() => {
  const KEY = 'snoozle:v1';
  const read = () => { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } };
  return {
    key: KEY,
    load() { // once at boot; may become async later
      const o = read();
      if (!o || o.v !== 1 || !Array.isArray(o.future)) return [];
      return o.future.filter(x => typeof x === 'string').map(x => x.trim().slice(0, 40)).filter(Boolean).slice(0, 50);
    },
    save(future) { // fire and forget; a newer build's data is never overwritten
      try {
        const o = read();
        if (o && typeof o === 'object' && o.v !== 1) return;
        localStorage.setItem(KEY, JSON.stringify({v: 1, future}));
      } catch (e) {}
    }
  };
})();

// ── CLOCK ──
function dateKey() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
const clockTick = () => { if (state.date && dateKey() !== state.date) act('newDay'); };
document.addEventListener('visibilitychange', () => { if (!document.hidden) clockTick(); });
setInterval(clockTick, 60000);
addEventListener('storage', e => { if (e.key === store.key || e.key === null) act('sync', store.load()); });

// ── ACT ──
const pick = a => a[Math.floor(Math.random() * a.length)];
const parkMove = (s, id) => {
  const i = s.moves.findIndex(m => m.id === id);
  const [m] = s.moves.splice(i, 1);
  s.futureMoves = [...s.futureMoves, m.text].slice(-50);
  return {text: m.text, persist: true};
};
const dropFuture = (s, i) => { const text = s.futureMoves[i]; s.futureMoves = s.futureMoves.filter((_, j) => j !== i); return text; };
function learn(s, text) {
  const id = `${s.date}-${++s.seq}`;
  s.moves.push({id, text, used: false});
  const over = derive(s).heavy;
  if (over) s.sheet = {t: 'heavy', id};
  return {text, over};
}
const kindOpts = k => [...COPY.thoughts.kinds[k].opts, COPY.thoughts.wander];
const REDUCERS = {
  newDay(s) { Object.assign(s, freshDay(dateKey())); return {cancel: true}; },
  reset(s) { return REDUCERS.newDay(s); },
  sync(s, list) { s.futureMoves = list; return {}; },
  go(s, screen) { s.screen = screen; return {}; },
  home(s) { s.screen = 'home'; s.sheet = null; return {}; },
  tap() { return {}; },
  sky(s, id) { s.sky = id; s.bond.add(`${s.date}:sky`); return {}; },
  care(s, k) {
    const n = s.cared.get(k) || 0;
    s.cared.set(k, n + 1); s.care++; s.bond.add(`${s.date}:care:${k}`);
    return {k, n};
  },
  teach(s, text) { return learn(s, text); },
  bring(s, i) { const c = learn(s, dropFuture(s, +i)); c.persist = true; return c; },
  use(s, id) { const m = s.moves.find(x => x.id === id); m.used = true; return {text: m.text}; },
  save(s, id) { return parkMove(s, id); },
  wait(s, id) { s.sheet = null; return parkMove(s, id); },
  letgo(s, i) { return {text: dropFuture(s, +i), persist: true}; },
  heavySave(s) { s.sheet = {t: 'which'}; return {}; },
  heavyCarry(s) { s.sheet = null; return {}; },
  usual(s, d) { const v = Math.min(10, Math.max(1, s.usual + +d)); const same = v === s.usual; s.usual = v; return {same}; },
  kind(s, k) { s.sheet = {t: 'kind', k: +k}; return {}; },
  thought(s, arg) {
    const [k, o] = arg.split(':').map(Number);
    const opt = kindOpts(k)[o];
    s.bond.add(`${s.date}:thought:${k}`);
    s.sheet = null;
    if (opt.go) s.screen = opt.go;
    return {opt, wander: opt === COPY.thoughts.wander};
  }
};
function act(type, arg) {
  const before = derive(state), was = state.screen;
  const ctx = REDUCERS[type](state, arg) || {};
  // One history entry per visit off Home, so the phone's back gesture returns Home instead of leaving.
  if (was === 'home' && state.screen !== 'home') history.pushState({snz: 1}, '');
  else if (was !== 'home' && state.screen === 'home' && history.state?.snz) history.back();
  if (ctx.cancel) cancelAll();
  const after = derive(state);
  render(after);
  if (ctx.persist) store.save(state.futureMoves);
  say(lineFor(type, arg, before, after, ctx));
  fx(effectsFor(type, before, after, ctx));
}
function movesIntro(d) {
  const m = COPY.moves, S = d.sky && COPY.skies[d.sky];
  if (!d.sky) return m.introNone;
  if (d.heavy) return m.introOver(S.label.toLowerCase());
  if (d.N < d.usual) return m.introLow(S.label);
  return m.introOk;
}
function lineFor(type, arg, b, a, c) {
  switch (type) {
    case 'newDay': case 'reset': return COPY.greeting;
    case 'home': return COPY.home;
    case 'go': return {
      garden: a.sky ? COPY.skies[a.sky].say : COPY.garden.intro,
      recharge: COPY.recharge.intro, moves: movesIntro(a), thoughts: COPY.thoughts.intro}[arg];
    case 'tap': return pick(COPY.tap);
    case 'sky': return COPY.skies[arg].say;
    case 'care': return COPY.recharge.cards.find(x => x.k === arg).r[c.n % 2] + (a.stage > b.stage ? COPY.recharge.grew : '');
    case 'teach': return c.over ? null : COPY.moves.learned(c.text);
    case 'bring': return c.over ? null : COPY.moves.welcome(c.text);
    case 'use': return pick(COPY.moves.used);
    case 'save': return COPY.moves.saved(c.text);
    case 'wait': return COPY.moves.safe(c.text);
    case 'letgo': return COPY.moves.bye(c.text);
    case 'heavyCarry': return COPY.moves.carry;
    case 'usual': return c.same ? null : COPY.moves.usualSet(a.usual);
    case 'thought': return c.opt.say;
  }
  return null;
}
// Pure: which reactions play. One body reaction (relief 3 > sit 2 > hop 1) plus accents.
const BUDDY = {left: 40, top: 45}, PLANT = {left: 68, top: 38};
function effectsFor(type, b, a, c) {
  const acc = [];
  const F = (e, at, n = 1) => acc.push({k: 'float', e, at, n});
  let body = null;
  switch (type) {
    case 'go': case 'usual': body = 'hop'; break;
    case 'sky': if (a.sky === 'sunny' || a.sky === 'cloudy') F('💗', BUDDY, 2); break;
    case 'care': body = 'hop'; F(c.k === 'rest' ? '💤' : '💗', BUDDY, 2); break;
    case 'teach': case 'bring':
      body = !b.heavy && a.heavy ? 'tremble' : 'hop'; F('✨', BUDDY);
      if (a.unfinished > b.unfinished && a.unfinished <= 5) acc.push({k: 'bundle'});
      break;
    case 'use': body = 'sit'; break;
    case 'save': case 'wait': case 'letgo':
      body = 'relief'; F('💨', {left: 58, top: 28}); acc.push({k: 'float', e: 'phew~', at: {left: 28, top: 30}, n: 1, word: true}); break;
    case 'tap': F('💗', BUDDY); break;
    case 'thought': body = 'hop'; F(c.wander ? '🍃' : '💗', BUDDY, 2); break;
  }
  if (type === 'care' || a.stage > b.stage) F('✨', PLANT);
  if (a.stage > b.stage) acc.push({k: 'pop'});
  if (a.line > b.line) { acc.push({k: 'flash'}); F('💞', BUDDY, 3); }
  return {body, acc};
}

// click events: one delegated listener
addEventListener('popstate', () => { if (state.screen !== 'home') act('home'); });
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const type = t.dataset.act;
  let arg = t.dataset.arg;
  if (type === 'skip') return skipTyper();
  if (type === 'teach') {
    const input = $('newmove');
    arg = input.value.trim().slice(0, 40);
    if (!arg) return input.focus();
    input.value = '';
  }
  if (type === 'thought') $('thought').value = '';
  act(type, arg);
});

// ── RENDER ──
const $ = id => document.getElementById(id);
function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const k in attrs) if (attrs[k] != null && attrs[k] !== false) n.setAttribute(k, attrs[k] === true ? '' : attrs[k]);
  n.append(...kids.filter(x => x != null && x !== false)); // strings become text nodes
  return n;
}
const btn = (act, arg, cls, ...kids) => el('button', {type: 'button', class: cls, 'data-act': act, 'data-arg': arg}, ...kids);
const em = e => el('span', {class: 'em'}, e);
const ui = {};

// Static SVG markup (sprites kept exactly as drawn in the prototype)
function plantSVG(stage, rainy){
  let p = `<ellipse class="p-soil" cx="20" cy="52" rx="15" ry="5"/>`;
  if (rainy) p += `<g><ellipse class="p-cloud" cx="18" cy="9" rx="10" ry="5"/><ellipse class="p-cloud" cx="25" cy="6" rx="6" ry="5"/><line class="p-drop" x1="15" y1="16" x2="14" y2="20"/><line class="p-drop" x1="23" y1="16" x2="22" y2="20"/></g>`;
  if (stage === 0) p += `<circle class="p-dot" cx="17" cy="51" r="1.5"/><circle class="p-dot" cx="23" cy="52" r="1.5"/>`;
  if (stage >= 1) p += `<path class="p-stem" d="M20 51 L20 ${stage === 1 ? 42 : 30}"/>`;
  if (stage === 1) p += `<path class="p-leaf" d="M20 44 C14 38 10 42 12 45 C15 47 18 46 20 44Z"/><path class="p-leaf" d="M20 44 C26 38 30 42 28 45 C25 47 22 46 20 44Z"/>`;
  if (stage >= 2) p += `<path class="p-leaf" d="M20 42 C13 36 9 40 11 43 C14 45 18 44 20 42Z"/><path class="p-leaf" d="M20 39 C27 33 31 37 29 40 C26 42 22 41 20 39Z"/>`;
  if (stage === 2) p += `<ellipse class="p-bud" cx="20" cy="27" rx="4" ry="6"/>`;
  if (stage === 3) p += [0,72,144,216,288].map(a => `<circle class="p-pet" cx="${20+6*Math.cos(a*Math.PI/180)}" cy="${28+6*Math.sin(a*Math.PI/180)}" r="4.2"/>`).join("") + `<circle class="p-mid" cx="20" cy="28" r="3.5"/>`;
  return `<svg viewBox="0 0 40 60" aria-hidden="true">${p}</svg>`;
}
(function makeRain(){
  let h = "";
  for (let i = 0; i < 22; i++){
    const x = 10 + Math.random()*300, y = 40 + Math.random()*40, d = (Math.random()*0.9).toFixed(2);
    h += `<line class="drop" x1="${x}" y1="${y}" x2="${x-3}" y2="${y+9}" style="animation-delay:-${d}s"/>`;
  }
  $("rain").innerHTML = h;
})();

// Skeletons: built once. render() only changes lists, labels and attributes, so drafts and focus survive.
function build() {
  const app = $('app');
  $('scene').setAttribute('aria-label', COPY.sceneLabel);
  ui.scene = $('scene'); ui.bond = el('p', {class: 'bond'});
  ui.typed = el('span', {id: 'typed', 'aria-hidden': 'true'});
  ui.live = el('span', {id: 'live', class: 'sr', 'aria-live': 'polite'});
  const dialog = el('div', {class: 'dialog'}, el('span', {class: 'nametag'}, COPY.tag),
    el('p', {id: 'say', 'data-act': 'skip'}, ui.typed, ui.live));

  ui.home = el('div', {}, el('div', {class: 'menu', role: 'navigation', 'aria-label': COPY.menuLabel},
    ...COPY.menu.map(([id, e, t]) => btn('go', id, '', em(e), el('span', {}, t)))),
    btn('reset', null, 'reset', COPY.reset));
  ui.backTop = btn('home', null, 'back back-top', COPY.back);
  $('scene-wrap').append(ui.backTop);

  // Garden
  ui.sky = {};
  const G = COPY.garden;
  ui.garden = el('div', {class: 'today-garden'});
  const weather = el('div', {class: 'weather'}, ...Object.entries(COPY.skies).map(([id, s]) =>
    (ui.sky[id] = btn('sky', id, 'wbtn', el('span', {}, s.e), s.label))));
  // Recharge
  ui.cards = {};
  const camp = el('div', {class: 'camp'}, ...COPY.recharge.cards.map(c => {
    ui.cards[c.k] = {title: el('span', {}, c.t), box: btn('care', c.k, 'cbtn', em(c.e))};
    ui.cards[c.k].box.append(el('span', {}, ui.cards[c.k].title, el('small', {}, c.s)));
    return ui.cards[c.k].box;
  }));
  // Moves
  const M = COPY.moves;
  ui.moveHint = el('p', {class: 'hint'}); ui.usual = el('b'); ui.grid = el('div', {class: 'moves'}); ui.future = el('ul', {class: 'daycare'});
  ui.futureHint = el('p', {class: 'hint'}, M.futureHint);
  ui.down = btn('usual', -1, 'step', '−'); ui.down.setAttribute('aria-label', M.fewer);
  ui.up = btn('usual', 1, 'step', '+'); ui.up.setAttribute('aria-label', M.more);
  const input = el('input', {id: 'newmove', placeholder: M.placeholder, maxlength: 40, 'aria-label': M.inputLabel});
  input.addEventListener('focus', () => input.scrollIntoView({block: 'nearest'}));
  input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) ui.teach.click(); });
  ui.teach = btn('teach', null, 'pbtn', M.teach);
  // Thoughts
  const T = COPY.thoughts;
  const kinds = el('div', {class: 'kinds'}, ...T.kinds.map((k, i) => btn('kind', i, 'kbtn', k.t, el('small', {}, k.s))));

  const tab = (id, ...kids) => (ui[id] = el('section', {class: 'tab'}, ...kids));
  app.append(ui.bond, dialog, ui.home,
    tab('garden-tab', weather, el('h2', {}, G.card), ui.garden),
    tab('recharge-tab', camp),
    tab('moves-tab', ui.moveHint, el('div', {class: 'teach'}, input, ui.teach), ui.grid,
      el('div', {class: 'baseline'}, M.usual, ui.down, ui.usual, ui.up),
      el('h2', {}, M.future), ui.futureHint, ui.future),
    tab('thoughts-tab',
      el('div', {class: 'grass-box'}, el('div', {class: 'grass-anim', 'aria-hidden': 'true'}, '🌾🌾🌾'),
        el('label', {for: 'thought'}, T.label, el('span', {}, T.optional)),
        el('textarea', {id: 'thought', placeholder: T.placeholder}),
        el('p', {}, T.ask), kinds)));
  ui.msay = el('p', {id: 'msay'}); ui.mopts = el('div', {class: 'opts'});
  ui.modal = el('div', {class: 'modal', hidden: true}, el('div', {class: 'sheet'},
    el('div', {class: 'dialog', role: 'dialog', 'aria-modal': 'true'}, el('span', {class: 'nametag'}, COPY.tag), ui.msay, ui.mopts)));
  document.body.append(ui.modal);
}

let packN = -1, plantStage = -1;
function renderScene(d) {
  ui.scene.setAttribute('class', 'w-' + (d.sky || 'none') + ' ' + (d.sky ? SKY[d.sky].anim : 'a-sway') + (d.heavy ? ' heavy' : ''));
  const shown = Math.min(5, d.unfinished);
  if (shown !== packN) {
    const colors = ["var(--heart)", "var(--sun)", "var(--sky)", "var(--leaf2)", "var(--heart)"];
    const items = Array.from({length:shown}, (_, i) =>
      `<rect class="bundle" style="fill:${colors[i]}" x="${18 + (i % 3) * 7}" y="${-57 - Math.floor(i / 3) * 8 - (i % 3 === 1 ? 3 : 0)}" width="7" height="15" rx="3"/>`).join("");
    $("pack").innerHTML = shown ? items +
      `<rect class="bag" x="16" y="-50" width="27" height="34" rx="8"/><path class="bag-flap" d="M16 -40 Q29 -32 43 -40"/><rect class="bag-pocket" x="26" y="-31" width="13" height="10" rx="3"/>` : "";
    $("strap").innerHTML = shown ? `<path class="strap" d="M8 -53 Q18 -40 25 -19"/>` : "";
    packN = shown;
  }
  if (d.stage !== plantStage) {
    $("scenePlant").innerHTML = plantSVG(d.stage, false).replace(/^<svg[^>]*>|<\/svg>$/g, "");
    plantStage = d.stage;
  }
  ui.bond.textContent = COPY.bond[d.line];
}
function renderMoves(d) {
  const M = COPY.moves, S = d.sky && COPY.skies[d.sky];
  ui.moveHint.textContent = S && d.N < d.usual ? M.hintBelow(S.e, S.label, d.N) : M.hintOk(d.N);
  ui.usual.textContent = d.usual;
  ui.down.disabled = d.usual <= 1; ui.up.disabled = d.usual >= 10;
  const cells = [];
  for (let i = 0; i < Math.max(d.N, state.moves.length); i++) {
    const m = state.moves[i];
    if (!m) { cells.push(el('div', {class: 'move empty'}, M.dash)); continue; }
    const over = !m.used && i >= d.N;
    cells.push(el('div', {class: 'move' + (m.used ? ' used' : '') + (over ? ' heavy' : '')},
      el('span', {class: 'mtext'}, m.text),
      m.used ? null : el('span', {class: 'mrow'}, btn('use', m.id, 'mini', M.useIt), btn('save', m.id, 'mini', M.saveIt))));
  }
  ui.grid.replaceChildren(...cells);
  ui.futureHint.hidden = !state.futureMoves.length;
  ui.future.replaceChildren(...(state.futureMoves.length ? state.futureMoves.map((t, i) =>
    el('li', {}, el('span', {}, t), el('span', {class: 'mrow'}, btn('bring', i, 'mini', M.bring), btn('letgo', i, 'mini', M.letGo))))
    : [el('li', {class: 'note'}, M.futureEmpty)]));
}
function renderSheet() {
  const s = state.sheet;
  ui.modal.hidden = !s;
  if (!s) return;
  const M = COPY.moves;
  let text, opts;
  if (s.t === 'heavy') {
    const m = state.moves.find(x => x.id === s.id);
    text = M.heavy(m ? m.text : ''); opts = [[M.heavySave, 'heavySave'], [M.heavyCarry, 'heavyCarry']];
  } else if (s.t === 'which') {
    text = M.which; opts = state.moves.filter(m => !m.used).map(m => [m.text, 'wait', m.id]);
  } else {
    const k = COPY.thoughts.kinds[s.k];
    text = COPY.thoughts.looks(k.s.toLowerCase(), k.q); opts = kindOpts(s.k).map((o, i) => [o.label, 'thought', s.k + ':' + i]);
  }
  ui.msay.textContent = text;
  ui.mopts.replaceChildren(...opts.map(([label, a, arg]) => btn(a, arg, 'opt', label)));
}
function render(d) {
  renderScene(d);
  const home = state.screen === 'home';
  ui.home.hidden = !home; ui.backTop.hidden = home;
  for (const [id] of COPY.menu) ui[id + '-tab'].hidden = state.screen !== id;
  for (const id in ui.sky) ui.sky[id].setAttribute('aria-pressed', d.sky === id);
  const rainy = d.sky === 'drizzly' || d.sky === 'stormy', [cap, more] = COPY.garden.stages[d.stage];
  ui.garden.innerHTML = plantSVG(d.stage, rainy);
  ui.garden.append(el('div', {}, el('p', {}, cap), el('small', {}, (rainy ? COPY.garden.rain : '') + more)));
  for (const c of COPY.recharge.cards) {
    const done = state.cared.has(c.k);
    ui.cards[c.k].box.classList.toggle('together', done);
    ui.cards[c.k].title.textContent = c.t + (done ? ' 🍃' : '');
  }
  renderMoves(d);
  renderSheet();
}

// ── FX ──
const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const tok = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
function play(node, frames, ms, easing = 'ease-out', delay = 0) {
  if (reduced()) return null;
  return node.animate(frames, {duration: ms, easing, delay, fill: 'backwards'});
}
const KF = {
  hop: [{transform: 'none'}, {transform: 'scale(1.08,.9)', offset: .2}, {transform: 'translateY(-22px) scale(.95,1.06)', offset: .5}, {transform: 'scale(1.06,.94)', offset: .8}, {transform: 'none'}],
  sit: [{transform: 'none'}, {transform: 'translateY(5px) scale(1.12,.8)', offset: .25}, {transform: 'translateY(5px) scale(1.12,.8)', offset: .8}, {transform: 'none'}],
  relief: [{transform: 'none'}, {transform: 'translateY(-6px) scale(.88,1.18)', offset: .35}, {transform: 'translateY(0) scale(1.08,.92)', offset: .6}, {transform: 'none'}],
  tremble: [{transform: 'none'}, {transform: 'rotate(4deg) translateY(3px)'}, {transform: 'rotate(2deg) translateY(2px)'}, {transform: 'rotate(4.5deg) translateY(3px)'}, {transform: 'rotate(2.5deg) translateY(2px)'}, {transform: 'rotate(4deg) translateY(3px)'}, {transform: 'none'}]
};
const BODY = {hop: [1, 'cubic-bezier(.3,.7,.4,1)'], tremble: [1, 'ease-in-out'], sit: [2, 'ease-in-out'], relief: [3, 'ease-out']};
const MS = {sit: 1300, relief: 900, tremble: 1200};
let current = null;
function body(name) {
  const [pri, easing] = BODY[name];
  if (current && current.anim.playState === 'running' && current.pri > pri) return; // a lower reaction is dropped
  if (current) current.anim.cancel();
  const anim = play($('buddy-react'), KF[name], MS[name] || parseFloat(tok('--t-react')), easing);
  current = anim && {anim, pri};
}
function float(emoji, at, i = 0, word = false) {
  const wrap = $('scene-wrap');
  if (reduced() || (!word && wrap.querySelectorAll('.fl').length >= 4)) return; // the "phew~" word is never dropped
  const s = el('span', {class: 'fl' + (word ? ' word' : ''), style: `left:${at.left + Math.random() * 20}%;top:${at.top + Math.random() * 15}%`}, emoji);
  wrap.append(s);
  const a = play(s, [{opacity: 0, transform: 'translateY(0) scale(.7)'}, {opacity: 1, offset: .15}, {opacity: 0, transform: 'translateY(-70px) scale(1.2)'}], 1300, 'ease-out', i * 150);
  a.onfinish = () => s.remove();
  a.oncancel = () => s.remove();
}
function fx(e) {
  if (e.body) body(e.body);
  for (const a of e.acc) {
    if (a.k === 'float') for (let i = 0; i < a.n; i++) float(a.e, a.at, i, a.word);
    else if (a.k === 'pop') play($('scenePlant'), [{transform: 'scale(.55)'}, {transform: 'none'}], 600, tok('--ease-spring'));
    else if (a.k === 'bundle') { const b = [...document.querySelectorAll('#pack .bundle')].pop(); if (b) play(b, [{transform: 'scale(.55)'}, {transform: 'none'}], 450, tok('--ease-spring')); }
    else if (a.k === 'flash') play(ui.bond, [{opacity: .3, transform: 'translateY(-3px)'}, {opacity: 1, transform: 'none'}], 1600);
  }
}
function cancelAll() {
  cancelTyper();
  current = null;
  document.getAnimations().forEach(a => { if (!a.animationName && !a.transitionProperty) a.cancel(); }); // script animations only; CSS loops stay
  document.querySelectorAll('.fl').forEach(n => n.remove());
}

// ── DIALOG ──
const typer = {timer: 0, text: ''};
const cancelTyper = () => clearInterval(typer.timer);
function skipTyper() { cancelTyper(); ui.typed.textContent = typer.text; }
function say(text) {
  if (text == null) return;
  cancelTyper();
  typer.text = text;
  ui.live.textContent = text; // the full line, once, for screen readers
  if (reduced()) { ui.typed.textContent = text; return; }
  let i = 0;
  ui.typed.textContent = '';
  typer.timer = setInterval(() => { ui.typed.textContent = text.slice(0, ++i); if (i >= text.length) cancelTyper(); }, 18);
}

// boot
build();
Promise.resolve(store.load()).then(future => { act('sync', future); act('newDay'); });
</script>
