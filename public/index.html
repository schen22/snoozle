<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snoozle’s Garden</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
/* ── TOKENS ── */
:root{
  --bg:#e6edda; --surface:#fbfcf6; --ink:#22301f; --muted:#5d6b57; --line:#22301f;
  --leaf:#4f8f43; --leaf2:#8fc66f; --grass:#9fcf7c; --grass2:#7db85c;
  --sky:#bfe0ee; --sky-rain:#a9bccb; --sky-storm:#7f879c;
  --sun:#f5c64a; --cloud:#ffffff; --cloud-dark:#d7dbe3; --drop:#4d86b8;
  --heart:#e46a7c; --soil:#a9744a; --soil2:#7f5534; --body:#f6eab9;
  --chip:#eef3e4; --on-leaf:#ffffff; --bolt:#ffffff; --scrim:rgba(10,16,10,.45); --face:#22301f;
  --t-quick:150ms; --t-react:450ms; --ease-spring:cubic-bezier(.3,1.6,.5,1);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#162016; --surface:#212c20; --ink:#eef3e4; --muted:#a9b7a2; --line:#d9e4cf;
    --leaf:#7cc06a; --leaf2:#a6d98a; --grass:#3f6a35; --grass2:#335a2b;
    --sky:#2d4654; --sky-rain:#2a3540; --sky-storm:#1d222c;
    --sun:#e8b93d; --cloud:#c9d2da; --cloud-dark:#7d8692; --drop:#8cbde6;
    --heart:#f08597; --soil:#8a5f3d; --soil2:#5f3f27; --body:#efe0a6;
    --chip:#2b3829; --on-leaf:#162016; --bolt:#ffffff;
    color-scheme:dark;
  }
}
/* ── STYLES ── */
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Nunito",ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) calc(24px + env(safe-area-inset-bottom,0px)) env(safe-area-inset-left,0px)}
.wrap{max-width:460px;margin:0 auto;padding:14px 14px 0}
button{font:inherit;color:inherit;cursor:pointer;min-height:44px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--heart);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* scene */
.scene-wrap{position:relative;border:3px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 4px 0 var(--line)}
#scene{display:block;width:100%;height:auto}
#sky{fill:var(--sky)}
.w-drizzly #sky{fill:var(--sky-rain)}
.w-stormy #sky{fill:var(--sky-storm)}
.sun{fill:var(--sun)}
.cloud{fill:var(--cloud)}
.w-drizzly .cloud,.w-stormy .cloud{fill:var(--cloud-dark)}
.w-sunny .cloud.c2,.w-sunny .cloud.c3{opacity:0}
.w-none .cloud.c3{opacity:0}
.w-drizzly .sun,.w-stormy .sun{opacity:0}
.w-cloudy .sun{opacity:.55}
#rain{opacity:0}
.w-drizzly #rain,.w-stormy #rain{opacity:1}
.drop{stroke:var(--drop);stroke-width:2;stroke-linecap:round}
.w-drizzly .drop{opacity:.75}
.w-drizzly .drop:nth-child(3n),.w-drizzly .drop:nth-child(3n+2){display:none}
#bolt{fill:var(--bolt);opacity:0}
.ground{fill:var(--grass)}
.tuft{stroke:var(--grass2);stroke-width:2.5;fill:none;stroke-linecap:round}
.b-line{stroke:var(--line);stroke-width:3}
.b-shadow{fill:var(--scrim)}
.b-body{fill:var(--body)}
.b-leaf{fill:var(--leaf2)}
.b-foot{fill:var(--leaf)}
.b-cheek{fill:var(--heart);opacity:.55}
.eyes-closed{display:none}
#buddy,#buddy-idle,#buddy-pose,#buddy-react,#scenePlant,.bundle{transform-box:fill-box;transform-origin:50% 100%}
#buddy{cursor:pointer}
.a-nap .eyes-open,.a-droop .eyes-open{display:none}
.a-nap .eyes-closed,.a-droop .eyes-closed{display:inline}
.a-nap .zz{opacity:1}
.zz{opacity:0;fill:var(--ink);font:700 14px "Nunito",sans-serif}
.mouth-strain,.brows,.sweat{display:none}
.sweat{fill:var(--sky);stroke:var(--face);stroke-width:1.5}
#scene.heavy .mouth-strain,#scene.heavy .brows,#scene.heavy .sweat{display:inline}
#scene.heavy .mouth-happy{display:none}
.umbrella{opacity:0;transform-box:fill-box;transform-origin:5% 100%;transform:scale(.2)}
.w-drizzly .umbrella,.w-stormy .umbrella{opacity:1;transform:none}
.umb-leaf{fill:var(--leaf2);stroke:var(--line);stroke-width:2.5;stroke-linejoin:round}
.umb-stem{fill:none;stroke:var(--leaf);stroke-width:3.5;stroke-linecap:round}
.umb-rib{fill:none;stroke:var(--leaf);stroke-width:2;stroke-linecap:round}
.bundle{stroke:var(--line);stroke-width:2}
.bag{fill:var(--soil);stroke:var(--line);stroke-width:2.5}
.bag-flap{fill:none;stroke:var(--line);stroke-width:2}
.bag-pocket{fill:var(--soil2);stroke:var(--line);stroke-width:2}
.strap{fill:none;stroke:var(--soil2);stroke-width:4;stroke-linecap:round}
.fl{position:absolute;font-size:22px;pointer-events:none;opacity:0}
.fl.word{font:800 18px "Nunito",sans-serif;color:var(--ink)}
.bond{margin:10px 2px 0;color:var(--muted);font-size:14px;font-style:italic;min-height:1.4em}

/* dialog box */
.dialog{position:relative;margin-top:16px;background:var(--surface);border:3px solid var(--line);border-radius:10px;padding:18px 16px 14px;box-shadow:inset 0 0 0 3px var(--surface),inset 0 0 0 5px var(--line);min-height:84px}
.nametag{position:absolute;top:-12px;left:14px;background:var(--line);color:var(--surface);font:10px/1 "Press Start 2P",ui-monospace,monospace;padding:6px 8px;border-radius:4px}
#say{margin:0;font-size:17px;font-weight:600;cursor:pointer}
#typed::after{content:"▾";display:inline-block;margin-left:6px;font-size:12px;color:var(--muted)}

h2{font-size:18px;font-weight:800;margin:24px 2px 10px}
.hint{color:var(--muted);font-size:14px;margin:-4px 2px 12px}
.tab{margin-top:16px}

/* weather */
.weather{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.wbtn{background:var(--surface);border:2.5px solid var(--line);border-radius:12px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700;font-size:13px;box-shadow:0 3px 0 var(--line)}
.wbtn span{font-size:26px;line-height:1.1}
.wbtn:active,.cbtn:active,.back:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.wbtn[aria-pressed="true"]{background:var(--chip);outline:3px solid var(--leaf);outline-offset:-6px}

/* garden card */
.today-garden{background:var(--surface);border:2.5px solid var(--line);border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:14px}
.today-garden svg{width:84px;height:auto;flex:none}
.today-garden p{margin:0;font-weight:700}
.today-garden small{display:block;color:var(--muted);font-weight:600;font-size:14px;margin-top:2px}
.p-soil{fill:var(--soil)}
.p-dot{fill:var(--soil2)}
.p-stem{stroke:var(--leaf);stroke-width:2.5;fill:none;stroke-linecap:round}
.p-leaf{fill:var(--leaf2)}
.p-bud{fill:var(--heart)}
.p-pet{fill:var(--heart)}
.p-mid{fill:var(--sun)}
.p-cloud{fill:var(--cloud-dark)}
.p-drop{stroke:var(--drop);stroke-width:2;stroke-linecap:round}

/* recharge */
.camp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cbtn{text-align:left;background:var(--surface);border:2.5px solid var(--line);border-radius:12px;padding:12px;box-shadow:0 3px 0 var(--line);display:flex;gap:10px;align-items:center;font-weight:700;font-size:15px;line-height:1.2}
.cbtn .em{font-size:26px}
.cbtn small{display:block;font-weight:600;color:var(--muted);font-size:12px;margin-top:2px}
.cbtn.together{background:var(--chip)}

/* moves */
.moves{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;background:var(--surface);border:3px solid var(--line);border-radius:10px;padding:10px}
.move{min-height:62px;min-width:0;border:2px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);display:flex;flex-direction:column;justify-content:space-between;gap:6px;font-weight:700;font-size:15px;line-height:1.2;text-align:left;overflow-wrap:anywhere}
.move.empty{border-style:dashed;color:var(--muted);font-weight:600;justify-content:center;align-items:center;background:transparent}
.move.used .mtext{text-decoration:line-through;color:var(--muted)}
.move.heavy{border-color:var(--heart);border-style:dashed}
.mrow{display:flex;gap:6px;flex-wrap:wrap}
.mini{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 12px;font-size:13px;font-weight:700}
.teach{display:flex;gap:8px;margin-bottom:12px}
.teach input{flex:1;min-width:0;font:inherit;font-size:16px;padding:10px 12px;border:2.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.pbtn{background:var(--leaf);color:var(--on-leaf);border:2.5px solid var(--line);border-radius:10px;padding:10px 16px;font-weight:800;box-shadow:0 3px 0 var(--line)}
.daycare{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.daycare li{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;background:var(--surface);border:2px dashed var(--line);border-radius:10px;padding:8px 10px;font-weight:700;overflow-wrap:anywhere}
.daycare li.note{border-style:solid;color:var(--muted);font-weight:600}
.baseline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700;margin:12px 2px 0}
.baseline b{min-width:1.5em;text-align:center;font-size:18px}
.step{width:44px;border:2px solid var(--line);border-radius:8px;background:var(--surface);font-weight:800;font-size:18px;line-height:1;box-shadow:0 2px 0 var(--line)}
.step:active{transform:translateY(2px);box-shadow:none}
.step:disabled{opacity:.45;cursor:default}

/* thoughts */
.grass-box{background:var(--surface);border:2.5px solid var(--line);border-radius:12px;padding:14px}
.grass-box label{font-weight:700;display:block;margin:8px 0 6px}
.grass-box label span{color:var(--muted);font-weight:600}
.grass-box textarea{width:100%;font:inherit;font-size:16px;border:2px solid var(--line);border-radius:8px;padding:10px;background:var(--bg);color:var(--ink);resize:vertical;min-height:64px}
.grass-box p{font-weight:700;margin:12px 0 0}
.kinds{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.kbtn{text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:10px 12px;font-weight:700}
.kbtn small{display:block;color:var(--muted);font-weight:600}
.grass-anim{font-size:30px;text-align:center;letter-spacing:4px}

/* menu, back row */
.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px;background:var(--surface);border:3px solid var(--line);border-radius:10px;padding:8px}
.menu button{display:flex;align-items:center;gap:8px;text-align:left;background:transparent;border:2px solid transparent;border-radius:8px;padding:8px 10px;font-weight:800;font-size:15px;line-height:1.15}
.menu button .em{font-size:22px}
.menu button:active{transform:translateY(1px)}
.back-top{position:absolute;top:8px;left:8px;z-index:2;padding:4px 12px;font-size:14px}
.back{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:2.5px solid var(--line);border-radius:8px;padding:7px 14px;font-weight:800;font-size:15px;box-shadow:0 3px 0 var(--line)}
.back::before{content:"◂";color:var(--heart)}
.where::before{content:"▸";color:var(--heart)}
.where .em{font-size:22px}
.reset{display:block;margin:20px auto 8px;background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline;padding:0 16px}

/* sheet */
.modal{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;z-index:30;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet{width:100%;max-width:460px}
.sheet .dialog{margin:0}
#msay{margin:0;font-weight:600;font-size:17px}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.opt{text-align:left;background:var(--surface);border:2.5px solid var(--line);border-radius:10px;padding:11px 12px;font-weight:700;box-shadow:0 3px 0 var(--line)}
.opt::before{content:"▸ ";color:var(--heart)}
[hidden]{display:none}

/* ── MOTION ── */
@media (prefers-reduced-motion: no-preference){
  #sky{transition:fill .6s}
  .sun,#rain{transition:opacity .6s}
  .cloud{transition:fill .6s,opacity .6s}
  .zz{transition:opacity .5s}
  .umbrella{transition:opacity .3s,transform .7s var(--ease-spring)}
  .wbtn,.cbtn,.back,.step{transition:transform .1s}
  .drop{animation:fall .9s linear infinite}
  .w-drizzly .drop{animation-duration:2.2s}
  .w-stormy #bolt{animation:flash 5s infinite}
  .a-bounce #buddy-idle{animation:bounce .7s ease-in-out infinite}
  .a-sway #buddy-idle{animation:sway 3.6s ease-in-out infinite}
  .a-droop #buddy-idle{animation:droop 3s ease-in-out infinite}
  .a-nap #buddy-idle{animation:breathe 3.2s ease-in-out infinite}
  #scene.heavy #buddy-idle{animation:none}
  #scene.heavy #buddy-pose{animation:sag 2.4s ease-in-out infinite}
  #typed::after{animation:blink 1s steps(2) infinite}
  .grass-anim{animation:rustle .25s ease-in-out 6}
  .tab:not([hidden]),#home:not([hidden]){animation:enter var(--t-quick) ease-out both}
  .modal:not([hidden]) .sheet{animation:enter var(--t-quick) ease-out both}
  @keyframes fall{from{transform:translateY(-30px)}to{transform:translateY(130px)}}
  @keyframes flash{0%,88%,100%{opacity:0}90%,94%{opacity:.4}92%{opacity:.1}}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
  @keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
  @keyframes droop{0%,100%{transform:translateY(2px) scaleY(.96)}50%{transform:translateY(4px) scaleY(.93)}}
  @keyframes breathe{0%,100%{transform:scale(1,.92)}50%{transform:scale(1.03,.96)}}
  @keyframes sag{0%,100%{transform:rotate(4deg) translateY(3px) scale(1.03,.92)}50%{transform:rotate(5deg) translateY(4px) scale(1.04,.9)}}
  @keyframes blink{50%{opacity:0}}
  @keyframes rustle{0%,100%{transform:rotate(0)}50%{transform:rotate(3deg)}}
  @keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
}
</style>
</head>
<body>

  <div class="scene-wrap" id="scene-wrap">

          <path class="mouth-strain" d="M-6 -20 q2 -2 4 0 q2 2 4 0 q2 -2 4 0" stroke="var(--face)" stroke-width="2.2" fill="none" stroke-linecap="round"/>

        </g></g></g>
      </g>
      </g>
    </svg>
  </div>
</div>
<script>
// ── COPY ──
const COPY = {

  garden: {

      ['A seed, tucked in.', 'It’ll grow with weather or a recharge.'],

    cards: [

// Facts only. Everything else (water, stage, N, heavy, friendship, line) is derived on every render.
const SKY = {sunny: {water: 1, anim: 'a-bounce'}, cloudy: {water: 1, anim: 'a-sway'}, drizzly: {water: 2, anim: 'a-droop'}, stormy: {water: 2, anim: 'a-nap'}};
const STAGE_AT = [0, 1, 3, 5];         // seed, sprout, bud, bloom: water needed
const BOND_AT = [0, 2, 6, 12, 20, 35]; // friendship needed for each line in COPY.bond
const freshDay = date => ({date, sky: null, care: 0, cared: new Map(), moves: [], seq: 0, bond: new Set(), usual: 4, screen: 'home', sheet: null});
const state = {...freshDay(''), futureMoves: []};
const nFor = (sky, b) => sky === 'drizzly' ? Math.max(1, Math.ceil(b * 0.75)) : sky === 'stormy' ? Math.max(1, Math.round(b / 2)) : b;
function derive(s) {
  const water = (s.sky ? SKY[s.sky].water : 0) + s.care;
  const N = nFor(s.sky, s.usual);
  const unfinished = s.moves.filter(m => !m.used).length;
  const load = s.moves.length; // taught today and still in the day (used + unfinished)
  const friendship = s.bond.size;
  return {
    sky: s.sky, usual: s.usual, water, N, unfinished, load, friendship,
    stage: STAGE_AT.filter(t => water >= t).length - 1,
    heavy: load > N && unfinished >= 1,
    line: BOND_AT.filter(t => friendship >= t).length - 1
  };
}

// ── STORE ──
const store = (() => {
  const KEY = 'snoozle:v1';
  const read = () => { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } };
  return {
    key: KEY,
    load() { // once at boot; may become async later
      const o = read();
      if (!o || o.v !== 1 || !Array.isArray(o.future)) return [];
      return o.future.filter(x => typeof x === 'string').map(x => x.trim().slice(0, 40)).filter(Boolean).slice(0, 50);
    },
    save(future) { // fire and forget; a newer build's data is never overwritten
      try {
        const o = read();
        if (o && typeof o === 'object' && o.v !== 1) return;
        localStorage.setItem(KEY, JSON.stringify({v: 1, future}));
      } catch (e) {}
    }
  };
})();

}
const clockTick = () => { if (state.date && dateKey() !== state.date) act('newDay'); };
document.addEventListener('visibilitychange', () => { if (!document.hidden) clockTick(); });
setInterval(clockTick, 60000);
addEventListener('storage', e => { if (e.key === store.key || e.key === null) act('sync', store.load()); });

}

  sync(s, list) { s.futureMoves = list; return {}; },
  go(s, screen) { s.screen = screen; return {}; },
  home(s) { s.screen = 'home'; s.sheet = null; return {}; },
  tap() { return {}; },
  sky(s, id) { s.sky = id; s.bond.add(`${s.date}:sky`); return {}; },
  care(s, k) {
    const n = s.cared.get(k) || 0;
    s.cared.set(k, n + 1); s.care++; s.bond.add(`${s.date}:care:${k}`);
    return {k, n};

  teach(s, text) { return learn(s, text); },

  use(s, id) { const m = s.moves.find(x => x.id === id); m.used = true; return {text: m.text}; },
  save(s, id) { return parkMove(s, id); },
  wait(s, id) { s.sheet = null; return parkMove(s, id); },
  letgo(s, i) { return {text: dropFuture(s, +i), persist: true}; },
  heavySave(s) { s.sheet = {t: 'which'}; return {}; },
  heavyCarry(s) { s.sheet = null; return {}; },
  usual(s, d) { const v = Math.min(10, Math.max(1, s.usual + +d)); const same = v === s.usual; s.usual = v; return {same}; },
  kind(s, k) { s.sheet = {t: 'kind', k: +k}; return {}; },

  else if (was !== 'home' && state.screen === 'home' && history.state?.snz) history.back();
  if (ctx.cancel) cancelAll();
  const after = derive(state);

}
function lineFor(type, arg, b, a, c) {
  switch (type) {
    case 'newDay': case 'reset': return COPY.greeting;
    case 'home': return COPY.home;
    case 'go': return {
      garden: a.sky ? COPY.skies[a.sky].say : COPY.garden.intro,
      recharge: COPY.recharge.intro, moves: movesIntro(a), thoughts: COPY.thoughts.intro}[arg];
    case 'tap': return pick(COPY.tap);
    case 'sky': return COPY.skies[arg].say;
    case 'care': return COPY.recharge.cards.find(x => x.k === arg).r[c.n % 2] + (a.stage > b.stage ? COPY.recharge.grew : '');
    case 'teach': return c.over ? null : COPY.moves.learned(c.text);
    case 'bring': return c.over ? null : COPY.moves.welcome(c.text);
    case 'use': return pick(COPY.moves.used);
    case 'save': return COPY.moves.saved(c.text);
    case 'wait': return COPY.moves.safe(c.text);
    case 'letgo': return COPY.moves.bye(c.text);

// Pure: which reactions play. One body reaction (relief 3 > sit 2 > hop 1) plus accents.
const BUDDY = {left: 40, top: 45}, PLANT = {left: 68, top: 38};
function effectsFor(type, b, a, c) {
  const acc = [];
  const F = (e, at, n = 1) => acc.push({k: 'float', e, at, n});
  let body = null;
  switch (type) {
    case 'go': case 'usual': body = 'hop'; break;
    case 'sky': if (a.sky === 'sunny' || a.sky === 'cloudy') F('💗', BUDDY, 2); break;
    case 'care': body = 'hop'; F(c.k === 'rest' ? '💤' : '💗', BUDDY, 2); break;
    case 'teach': case 'bring':
      body = !b.heavy && a.heavy ? 'tremble' : 'hop'; F('✨', BUDDY);
      if (a.unfinished > b.unfinished && a.unfinished <= 5) acc.push({k: 'bundle'});
      break;
    case 'use': body = 'sit'; break;
    case 'save': case 'wait': case 'letgo':
      body = 'relief'; F('💨', {left: 58, top: 28}); acc.push({k: 'float', e: 'phew~', at: {left: 28, top: 30}, n: 1, word: true}); break;
    case 'tap': F('💗', BUDDY); break;
    case 'thought': body = 'hop'; F(c.wander ? '🍃' : '💗', BUDDY, 2); break;

      `<rect class="bundle" style="fill:${colors[i]}" x="${18 + (i % 3) * 7}" y="${-57 - Math.floor(i / 3) * 8 - (i % 3 === 1 ? 3 : 0)}" width="7" height="15" rx="3"/>`).join("");
    $("pack").innerHTML = shown ? items +
      `<rect class="bag" x="16" y="-50" width="27" height="34" rx="8"/><path class="bag-flap" d="M16 -40 Q29 -32 43 -40"/><rect class="bag-pocket" x="26" y="-31" width="13" height="10" rx="3"/>` : "";
    $("strap").innerHTML = shown ? `<path class="strap" d="M8 -53 Q18 -40 25 -19"/>` : "";
    packN = shown;
  }
  if (d.stage !== plantStage) {
    $("scenePlant").innerHTML = plantSVG(d.stage, false).replace(/^<svg[^>]*>|<\/svg>$/g, "");
    plantStage = d.stage;
  }
  ui.bond.textContent = COPY.bond[d.line];
}
function renderMoves(d) {
  const M = COPY.moves, S = d.sky && COPY.skies[d.sky];
  ui.moveHint.textContent = S && d.N < d.usual ? M.hintBelow(S.e, S.label, d.N, d.usual) : M.hintOk(d.N);
  ui.usual.textContent = d.usual;
  ui.down.disabled = d.usual <= 1; ui.up.disabled = d.usual >= 10;
  const cells = [];
  for (let i = 0; i < Math.max(d.N, state.moves.length); i++) {
    const m = state.moves[i];
    if (!m) { cells.push(el('div', {class: 'move empty'}, M.dash)); continue; }
    const over = !m.used && i >= d.N;
    cells.push(el('div', {class: 'move' + (m.used ? ' used' : '') + (over ? ' heavy' : '')},
      el('span', {class: 'mtext'}, m.text),
      m.used ? null : el('span', {class: 'mrow'}, btn('use', m.id, 'mini', M.useIt), btn('save', m.id, 'mini', M.saveIt))));
  }
  ui.grid.replaceChildren(...cells);
  ui.future.replaceChildren(...(state.futureMoves.length ? state.futureMoves.map((t, i) =>
    el('li', {}, el('span', {}, t), el('span', {class: 'mrow'}, btn('bring', i, 'mini', M.bring), btn('letgo', i, 'mini', M.letGo))))
    : [el('li', {class: 'note'}, M.futureEmpty)]));
}
function renderSheet() {
  const s = state.sheet;
  ui.modal.hidden = !s;
  if (!s) return;
  const M = COPY.moves;
  let text, opts;
  if (s.t === 'heavy') {
    const m = state.moves.find(x => x.id === s.id);
    text = M.heavy(m ? m.text : ''); opts = [[M.heavySave, 'heavySave'], [M.heavyCarry, 'heavyCarry']];
  } else if (s.t === 'which') {
    text = M.which; opts = state.moves.filter(m => !m.used).map(m => [m.text, 'wait', m.id]);
  } else {
    const k = COPY.thoughts.kinds[s.k];
    text = COPY.thoughts.looks(k.s.toLowerCase(), k.q); opts = kindOpts(s.k).map((o, i) => [o.label, 'thought', s.k + ':' + i]);
  }
  ui.msay.textContent = text;
  ui.mopts.replaceChildren(...opts.map(([label, a, arg]) => btn(a, arg, 'opt', label)));
}
function render(d) {
  renderScene(d);
  const home = state.screen === 'home';
  ui.home.hidden = !home; ui.backTop.hidden = home;
  for (const [id] of COPY.menu) ui[id + '-tab'].hidden = state.screen !== id;
  for (const id in ui.sky) ui.sky[id].setAttribute('aria-pressed', d.sky === id);
  const rainy = d.sky === 'drizzly' || d.sky === 'stormy', [cap, more] = COPY.garden.stages[d.stage];
  ui.garden.innerHTML = plantSVG(d.stage, rainy);
  ui.garden.append(el('div', {}, el('p', {}, cap), el('small', {}, (rainy ? COPY.garden.rain : '') + more)));
  for (const c of COPY.recharge.cards) {
    const done = state.cared.has(c.k);
    ui.cards[c.k].box.classList.toggle('together', done);
    ui.cards[c.k].title.textContent = c.t + (done ? ' 🍃' : '');
  }
  renderMoves(d);
  renderSheet();
}

// ── FX ──
const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const tok = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
function play(node, frames, ms, easing = 'ease-out', delay = 0) {
  if (reduced()) return null;
  return node.animate(frames, {duration: ms, easing, delay, fill: 'backwards'});
}
const KF = {
  hop: [{transform: 'none'}, {transform: 'scale(1.08,.9)', offset: .2}, {transform: 'translateY(-22px) scale(.95,1.06)', offset: .5}, {transform: 'scale(1.06,.94)', offset: .8}, {transform: 'none'}],
  sit: [{transform: 'none'}, {transform: 'translateY(5px) scale(1.12,.8)', offset: .25}, {transform: 'translateY(5px) scale(1.12,.8)', offset: .8}, {transform: 'none'}],
  relief: [{transform: 'none'}, {transform: 'translateY(-6px) scale(.88,1.18)', offset: .35}, {transform: 'translateY(0) scale(1.08,.92)', offset: .6}, {transform: 'none'}],
  tremble: [{transform: 'none'}, {transform: 'rotate(4deg) translateY(3px)'}, {transform: 'rotate(2deg) translateY(2px)'}, {transform: 'rotate(4.5deg) translateY(3px)'}, {transform: 'rotate(2.5deg) translateY(2px)'}, {transform: 'rotate(4deg) translateY(3px)'}, {transform: 'none'}]
};
const BODY = {hop: [1, 'cubic-bezier(.3,.7,.4,1)'], tremble: [1, 'ease-in-out'], sit: [2, 'ease-in-out'], relief: [3, 'ease-out']};
const MS = {sit: 1300, relief: 900, tremble: 1200};
let current = null;
function body(name) {
  const [pri, easing] = BODY[name];
  if (current && current.anim.playState === 'running' && current.pri > pri) return; // a lower reaction is dropped
  if (current) current.anim.cancel();
  const anim = play($('buddy-react'), KF[name], MS[name] || parseFloat(tok('--t-react')), easing);
  current = anim && {anim, pri};
}
function float(emoji, at, i = 0, word = false) {
  const wrap = $('scene-wrap');
  if (reduced() || (!word && wrap.querySelectorAll('.fl').length >= 4)) return; // the "phew~" word is never dropped
  const s = el('span', {class: 'fl' + (word ? ' word' : ''), style: `left:${at.left + Math.random() * 20}%;top:${at.top + Math.random() * 15}%`}, emoji);
  wrap.append(s);
  const a = play(s, [{opacity: 0, transform: 'translateY(0) scale(.7)'}, {opacity: 1, offset: .15}, {opacity: 0, transform: 'translateY(-70px) scale(1.2)'}], 1300, 'ease-out', i * 150);
  a.onfinish = () => s.remove();
  a.oncancel = () => s.remove();
}
function fx(e) {
  if (e.body) body(e.body);
  for (const a of e.acc) {
    if (a.k === 'float') for (let i = 0; i < a.n; i++) float(a.e, a.at, i, a.word);
    else if (a.k === 'pop') play($('scenePlant'), [{transform: 'scale(.55)'}, {transform: 'none'}], 600, tok('--ease-spring'));
    else if (a.k === 'bundle') { const b = [...document.querySelectorAll('#pack .bundle')].pop(); if (b) play(b, [{transform: 'scale(.55)'}, {transform: 'none'}], 450, tok('--ease-spring')); }
    else if (a.k === 'flash') play(ui.bond, [{opacity: .3, transform: 'translateY(-3px)'}, {opacity: 1, transform: 'none'}], 1600);
  }
}
function cancelAll() {
  cancelTyper();
  current = null;
  document.getAnimations().forEach(a => { if (!a.animationName && !a.transitionProperty) a.cancel(); }); // script animations only; CSS loops stay
  document.querySelectorAll('.fl').forEach(n => n.remove());
}

// ── DIALOG ──
const typer = {timer: 0, text: ''};
const cancelTyper = () => clearInterval(typer.timer);
function skipTyper() { cancelTyper(); ui.typed.textContent = typer.text; }
function say(text) {
  if (text == null) return;
  cancelTyper();
  typer.text = text;
  ui.live.textContent = text; // the full line, once, for screen readers
  if (reduced()) { ui.typed.textContent = text; return; }
  let i = 0;
  ui.typed.textContent = '';
  typer.timer = setInterval(() => { ui.typed.textContent = text.slice(0, ++i); if (i >= text.length) cancelTyper(); }, 18);
}

// boot
build();
Promise.resolve(store.load()).then(future => { act('sync', future); act('newDay'); });
</script>
